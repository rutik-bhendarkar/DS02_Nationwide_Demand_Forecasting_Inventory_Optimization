[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds02-demand-inventory-optimization"
version = "0.1.0"
description = "Nationwide retail demand forecasting and inventory optimization project"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Proprietary - Internship Project" }
authors = [{ name = "Nexvia Technologies Internship - DS-02" }]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "pytest-cov>=5.0,<8.0", "ruff>=0.5,<1.0"]
eda = ["plotly>=5.22"]
dashboard = ["dash>=3.0,<5.0", "plotly>=5.22"]
prophet_lightgbm = ["prophet>=1.1.6", "lightgbm>=4.5", "scikit-learn>=1.4,<2.0", "joblib>=1.3"]
darts = ["darts>=0.41.0"]
torch_forecasting = ["torch>=2.2", "pytorch-forecasting>=1.0", "lightning>=2.2"]
optimization = ["ortools>=9.10,<10", "scipy>=1.11,<2"]
all_optional = [
  "dash>=3.0,<5.0", "plotly>=5.22", "prophet>=1.1.6", "lightgbm>=4.5",
  "darts>=0.41.0", "torch>=2.2", "pytorch-forecasting>=1.0", "lightning>=2.2", "scikit-learn>=1.4,<2.0", "joblib>=1.3", "ortools>=9.10,<10", "scipy>=1.11,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
